<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="HowardCrypt — Kalkulator Kriptografi Klasik berbasis web. Implementasi Vigenere, Affine, Playfair, Hill, dan Enigma Cipher.">
    <title>HowardCrypt — Kalkulator Kriptografi Klasik</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
</head>

<body>
    <!-- Background -->
    <div class="bg-gradient"></div>
    <div id="particles"></div>
    <div class="watermark">HOWARD</div>

    <div class="app-container">
        <!-- Header / Navbar -->
        <header class="app-header">
            <div class="app-logo">
                <div class="logo-icon">🔐</div>
                <h1 class="app-title">HowardCrypt</h1>
            </div>
            <div class="header-meta">
                <div>Kriptografi Klasik</div>
                <div>2025 / 2026</div>
            </div>
        </header>

        <!-- Cipher Navigation -->
        <nav class="cipher-nav" id="cipher-nav">
            <button class="cipher-nav-btn active" data-cipher="vigenere" id="nav-vigenere">
                <span class="nav-label">Vigenere</span>
            </button>
            <button class="cipher-nav-btn" data-cipher="affine" id="nav-affine">
                <span class="nav-label">Affine</span>
            </button>
            <button class="cipher-nav-btn" data-cipher="playfair" id="nav-playfair">
                <span class="nav-label">Playfair</span>
            </button>
            <button class="cipher-nav-btn" data-cipher="hill" id="nav-hill">
                <span class="nav-label">Hill</span>
            </button>
            <button class="cipher-nav-btn" data-cipher="enigma" id="nav-enigma">
                <span class="nav-label">Enigma</span>
            </button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="card">
                <div class="card-body">
                    <!-- Cipher Info -->
                    <div class="cipher-info">
                        <h2 id="cipher-title">Vigenere Cipher</h2>
                        <p id="cipher-description"></p>
                    </div>

                    <!-- Key Input Section -->
                    <div class="key-section">
                        <div class="key-section-title">
                            <span>Key Configuration</span>
                        </div>
                        <div id="key-inputs">
                            <!-- Dynamic key inputs rendered here -->
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div class="error-message" id="error-message"></div>

                    <!-- Text Areas -->
                    <div class="text-area-group">
                        <div class="text-area-wrapper">
                            <div class="text-area-label">
                                <span>Input</span>
                            </div>
                            <textarea id="input-text" placeholder="Masukkan teks..." spellcheck="false"></textarea>
                        </div>
                        <div class="text-area-wrapper">
                            <div class="text-area-label">
                                <span>Output</span>
                            </div>
                            <textarea id="output-text" placeholder="Hasil..." readonly spellcheck="false"></textarea>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button class="btn btn-encrypt" id="btn-encrypt">
                            <span class="btn-icon">→</span> Enkripsi
                        </button>
                        <button class="btn btn-decrypt" id="btn-decrypt">
                            <span class="btn-icon">←</span> Dekripsi
                        </button>
                        <button class="btn btn-secondary" id="btn-swap">
                            <span class="btn-icon">⇄</span> Tukar
                        </button>
                        <button class="btn btn-secondary" id="btn-copy">
                            <span class="btn-icon">⎘</span> Salin
                        </button>
                        <button class="btn btn-secondary" id="btn-clear">
                            <span class="btn-icon">✕</span> Bersihkan
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Howard Amadeus Tjong - 21120123140167</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/vigenere.js"></script>
    <script src="js/affine.js"></script>
    <script src="js/playfair.js"></script>
    <script src="js/hill.js"></script>
    <script src="js/enigma.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
